<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="Confirm sign-in · UChicago Login Assistant">UChicago</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="icon" type="image/png" href="icons/icon-32.png">
</head>
<body class="confirm shortcut" data-locale-pending>
  <header class="brand"><img class="brand-icon" src="icons/icon-128.png" width="32" height="32" alt=""><div><strong lang="en-US">UChicago</strong><small data-i18n>Login Assistant</small></div></header>
  <main>
    <h1 id="title" data-i18n>Loading your request…</h1>
    <p class="help sign-in-explanation" id="sign-in-explanation" hidden></p>
    <dl id="details" hidden>
      <dt data-i18n>Account</dt><dd id="username"></dd>
      <dt id="rp-label" hidden data-i18n>Passkey site</dt><dd id="rp" hidden></dd>
    </dl>
    <form id="confirm-form">
      <div class="field" id="choices-field" hidden>
        <label for="choices" data-i18n>Passkey</label><select id="choices"></select>
      </div>
      <div class="field" id="pin-field" hidden>
        <label id="pin-label" for="pin" data-i18n>Verification PIN (optional)</label>
        <input id="pin" type="password" autocomplete="off" maxlength="128" aria-describedby="pin-help">
        <p class="help" id="pin-help" data-i18n>Use your extension PIN, not your school password.</p>
      </div>
      <p class="notice" id="notice" hidden></p>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="actions">
        <button type="button" id="cancel" aria-keyshortcuts="Escape" data-i18n>Cancel</button>
        <button class="primary" type="button" id="enroll" hidden data-i18n>Add a new passkey</button>
        <button class="primary" type="submit" id="approve" aria-keyshortcuts="Enter Space" disabled data-i18n>Confirm</button>
      </div>
    </form>
    <details class="disclosure consent-details">
      <summary data-i18n>Details</summary>
      <p class="help" id="consent-help"></p>
      <p class="help" id="keyboard-help" data-i18n>Enter / Space to confirm; Esc to cancel. Focused controls keep their usual keys.</p>
    </details>
    <button class="text secondary-action" type="button" id="fallback" hidden data-i18n>Use another passkey provider</button>
  </main>
  <script type="module" src="start.js"></script>
</body>
</html>
